
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Bài tập CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1, h2 {
            color: #263b63;
        }

        .exercise {
            padding: 15px;
            margin: 12px 0;
            background: #f2f4f8;
            border-radius: 8px;
        }

        a {
            color: #2469b2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="profile">
      <img src="./avatar.jpg" alt="Ảnh cá nhân" width="200">
        <h1>Nguyễn Ngọc Hà My</h1>
        <p>Sinh viên ngành Thương mại điện tử</p>
        <p>Đại học Kinh tế TP.HCM</p>
    </div>

    <div class="exercise">
        <h3>Minh chứng chơi game</h3>
        <a href="https://docs.google.com/document/d/1D0UJGO2OMsemxmS0aghk2WXjbDCXR31mSt5NxgHfedE/edit?usp=sharing"
           target="_blank">Xem minh chứng hoàn thành game</a>
    </div>

    <h2>Thông tin liên hệ</h2>
    <p>Facebook: <a href="https://www.facebook.com/ha.my.296014?locale=vi_VN">Trang cá nhân</a></p>
    <p>GitHub: <a href="https://github.com/mynguyen-123/Tuan3">Tài khoản GitHub</a></p>

</div>
</body>
</html>
